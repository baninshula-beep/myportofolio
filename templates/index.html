<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ name }} - Portofolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>

<body>

    <header class="site-header">
        <div class="container">

            <a href="{% url 'main:show_main' %}" class="brand">
                AFIQAH
            </a>

            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_education' %}">Education</a>
            </nav>

        </div>
    </header>

    <main>
        <section class="hero" id="profile">

            <div class="container hero-grid">

                <div class="hero-identity">

                    <p class="hero-kicker">
                        Information System &middot; Universitas Indonesia
                    </p>

                    <h1 class="profile-name">{{ name }}</h1>

                </div>

                <div class="hero-photo">

                    <div class="photo-block"></div>

                    <img
                        class="avatar"
                        src="/static/img/fotow.png"
                        alt="Photo of Afiqah"
                    >

                </div>

                <div class="hero-details">

                    <p class="bio">
                        {{ bio }}
                    </p>

                    <dl class="meta-list">

                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>

                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>

                    </dl>

                    <div class="social-links">

                        <a href="https://github.com/baninshula-beep" class="social-link">
                            GitHub
                        </a>

                        <a href="https://www.linkedin.com/in/afiqah-aradena" class="social-link">
                            LinkedIn
                        </a>

                        <a href="https://www.instagram.com/afiqaharadena/" class="social-link">
                            Instagram
                        </a>

                        <a href="mailto:aradenaafiqah@gmail.com" class="social-link">
                            Email
                        </a>

                    </div>

                </div>

            </div>

        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 {{ name }}.
                Fakultas Ilmu Komputer, Universitas Indonesia.
            </p>
        </div>
    </footer>

</body>
</html>
